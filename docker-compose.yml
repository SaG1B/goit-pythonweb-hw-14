version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: photoshare_db
    restart: always
    environment:
      POSTGRES_DB: photoshare_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secretpassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build: .
    container_name: photoshare_app
    restart: always
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:secretpassword@db:5432/photoshare_db
    depends_on:
      - db

volumes:
  postgres_data:
